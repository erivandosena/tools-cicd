stages: [images]
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never
variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_CERT_PATH: /certs/client
  DOCKER_TLS_VERIFY: "1"
images:
  stage: images
  image: docker:29.9.1-cli
  services:
    - name: docker:29.9.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  tags: [tools-docker]
  resource_group: dockerhub-tools
  timeout: 3h
  before_script:
    - apk add --no-cache bash python3 git
    - docker info
    - docker buildx version
  script:
    - export VERSION="1.6.0-gitlab.${CI_PIPELINE_ID}.${CI_JOB_ID}"
    - python3 tests/test-project.py
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
    - BUILD_ONLY=1 bash scripts/build.sh
    - bash scripts/publish.sh "$VERSION"
  after_script:
    - docker logout docker.io
