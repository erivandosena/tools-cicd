stages: [images]
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never
variables:
  DOCKER_HOST: tcp://docker:2376
  # /builds é compartilhado entre job e serviços no executor Kubernetes.
  # Fica fora do checkout para não ser apagado pelo git clean do Runner.
  DOCKER_TLS_CERTDIR: "$CI_BUILDS_DIR/.docker-certs-$CI_JOB_ID"
  DOCKER_CERT_PATH: "$CI_BUILDS_DIR/.docker-certs-$CI_JOB_ID/client"
  DOCKER_TLS_VERIFY: "1"
  DIND_READY_TIMEOUT: "300"
images:
  stage: images
  image: docker:29.9.1-cli
  services:
    - name: docker:29.9.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  tags: [kubernetes]
  resource_group: dockerhub-tools
  timeout: 3h
  before_script:
    - apk add --no-cache bash python3 git
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then break; fi
        sleep 2
      done
      docker info
    - docker buildx version
  script:
    - export VERSION="1.6.0-gitlab.${CI_PIPELINE_ID}.${CI_JOB_ID}"
    - python3 tests/test-project.py
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
    - |
      if [ "${DIND_DIAGNOSTIC_ONLY:-0}" = "1" ]; then
        for kind in alpine ubuntu; do
          image="docker.io/unlb/tools-$kind:latest"
          docker pull "$image"
          bash scripts/test-local.sh "$image"
        done
        echo DIAGNOSTICO_DIND_PASS
      else
        mkdir -p .local/reports
        export BUILDX_BUILDER="tools-${CI_JOB_ID}"
        docker context create "${BUILDX_BUILDER}-tls" \
          --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
        docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --use "${BUILDX_BUILDER}-tls"
        docker buildx inspect --bootstrap > .local/reports/buildkit-builder.txt 2>&1 || {
          cat .local/reports/buildkit-builder.txt
          exit 1
        }
        cat .local/reports/buildkit-builder.txt
        docker logs --follow --timestamps "buildx_buildkit_${BUILDX_BUILDER}0" \
          > .local/reports/buildkit.log 2>&1 &
        BUILD_ONLY=1 bash scripts/build.sh
        bash scripts/publish.sh "$VERSION"
      fi
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - .local/reports/
  after_script:
    - |
      if [ "${DIND_DIAGNOSTIC_ONLY:-0}" != "1" ]; then
        mkdir -p .local/reports
        builder="tools-${CI_JOB_ID}"
        container="buildx_buildkit_${builder}0"
        docker inspect --format '{{json .State}}' "$container" \
          > .local/reports/buildkit-state.json 2> .local/reports/buildkit-state-error.txt || true
        docker logs --timestamps "$container" \
          > .local/reports/buildkit-final.log 2>&1 || true
        if docker buildx inspect "$builder" >/dev/null 2>&1; then
          docker buildx rm "$builder" || true
        fi
        if docker context inspect "${builder}-tls" >/dev/null 2>&1; then
          docker context rm "${builder}-tls" || true
        fi
      fi
    - docker logout docker.io
