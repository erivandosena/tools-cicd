name: Build e publicação Docker Hub
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: dockerhub-tools
  cancel-in-progress: false
jobs:
  images:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, testes, auditoria e push das duas imagens
        env:
          VERSION: 1.6.0-github.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          python3 tests/test-project.py
          BUILD_ONLY=1 bash scripts/build.sh
          bash scripts/publish.sh "$VERSION"
